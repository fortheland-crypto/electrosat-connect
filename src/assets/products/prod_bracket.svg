<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="joint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Grid accent -->
  <circle cx="400" cy="400" r="320" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8 8"/>
  
  <!-- TV Wall Bracket Hardware Graphic -->
  <g filter="url(#shadow)" transform="translate(100, 100)">
    <!-- Wall Plate -->
    <rect x="60" y="160" width="120" height="280" rx="12" fill="url(#steel)"/>
    <circle cx="120" cy="200" r="12" fill="#cbd5e1"/>
    <circle cx="120" cy="200" r="6" fill="#0f172a"/>
    <circle cx="120" cy="400" r="12" fill="#cbd5e1"/>
    <circle cx="120" cy="400" r="6" fill="#0f172a"/>
    
    <!-- Articulated Arm 1 -->
    <path d="M120 300 L280 220 L300 240 L140 320 Z" fill="url(#joint)"/>
    <circle cx="290" cy="230" r="16" fill="url(#steel)"/>
    
    <!-- Articulated Arm 2 -->
    <path d="M290 230 L450 300 L430 320 L270 250 Z" fill="url(#joint)"/>
    <circle cx="440" cy="310" r="18" fill="url(#steel)"/>

    <!-- Front VESA Mounting Plate -->
    <rect x="420" y="180" width="160" height="260" rx="10" fill="url(#steel)"/>
    
    <!-- VESA Vertical Arms -->
    <rect x="400" y="120" width="30" height="380" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <rect x="570" y="120" width="30" height="380" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    
    <!-- VESA Holes -->
    <circle cx="415" cy="160" r="6" fill="#cbd5e1"/>
    <circle cx="415" cy="240" r="6" fill="#cbd5e1"/>
    <circle cx="415" cy="320" r="6" fill="#cbd5e1"/>
    <circle cx="415" cy="400" r="6" fill="#cbd5e1"/>
    <circle cx="415" cy="460" r="6" fill="#cbd5e1"/>
    
    <circle cx="585" cy="160" r="6" fill="#cbd5e1"/>
    <circle cx="585" cy="240" r="6" fill="#cbd5e1"/>
    <circle cx="585" cy="320" r="6" fill="#cbd5e1"/>
    <circle cx="585" cy="400" r="6" fill="#cbd5e1"/>
    <circle cx="585" cy="460" r="6" fill="#cbd5e1"/>
    
    <!-- Adjustment knobs -->
    <circle cx="500" cy="310" r="14" fill="#2563eb"/>
    <circle cx="500" cy="310" r="6" fill="#ffffff"/>
  </g>

  <!-- Label Badge -->
  <rect x="230" y="680" width="340" height="60" rx="30" fill="#1e293b" filter="url(#shadow)"/>
  <text x="400" y="718" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Поворотный Кронштейн для ТВ</text>
</svg>
