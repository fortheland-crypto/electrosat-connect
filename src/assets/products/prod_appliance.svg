<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg4)"/>

  <g filter="url(#shadow4)" transform="translate(100, 120)">
    <!-- Electric Kettle -->
    <g transform="translate(40, 80)">
      <!-- Base -->
      <ellipse cx="140" cy="380" rx="120" ry="24" fill="#1e293b"/>
      <!-- Body -->
      <path d="M 50 370 C 40 200, 70 140, 110 120 L 170 120 C 210 140, 240 200, 230 370 Z" fill="url(#chrome)" stroke="#94a3b8" stroke-width="3"/>
      <!-- Lid & Spout -->
      <path d="M 40 160 L 20 180 L 50 200 Z" fill="url(#chrome)"/>
      <rect x="100" y="100" width="80" height="24" rx="10" fill="#1e293b"/>
      <!-- Handle -->
      <path d="M 220 150 C 300 200, 300 320, 220 360" fill="none" stroke="#1e293b" stroke-width="26" stroke-linecap="round"/>
      <!-- Water Level Indicator -->
      <rect x="130" y="180" width="20" height="140" rx="10" fill="#2563eb" opacity="0.8"/>
    </g>

    <!-- Steam Iron -->
    <g transform="translate(320, 240)">
      <!-- Soleplate Base -->
      <path d="M 0 160 L 260 160 C 280 160, 290 140, 240 80 L 120 40 C 60 40, 0 100, 0 160 Z" fill="#2563eb"/>
      <path d="M -10 160 L 270 160 L 250 180 L 0 180 Z" fill="#cbd5e1"/>
      <!-- Handle -->
      <path d="M 40 50 C 40 -10, 200 -10, 220 50" fill="none" stroke="#1e293b" stroke-width="24" stroke-linecap="round"/>
      <!-- Temperature dial -->
      <circle cx="130" cy="80" r="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    </g>
  </g>

  <!-- Label Badge -->
  <rect x="160" y="680" width="480" height="60" rx="30" fill="#1e293b" filter="url(#shadow4)"/>
  <text x="400" y="718" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Бытовая техника: Чайники, Утюги, Фены</text>
</svg>
